# ============================================================================
#  Compila PoTranslator.exe automaticamente en Windows (GitHub Actions).
#
#  - Push a main -> artefactos en la pestana "Actions".
#  - Etiqueta v*  -> Release permanente con CUATRO archivos:
#      * PoTranslator.exe                 (archivo unico)
#      * PoTranslator.exe.sha256
#      * PoTranslator-portable-win64.zip  (carpeta portable: pasa mejor
#        los antivirus porque no es autoextraible)
#      * PoTranslator-portable-win64.zip.sha256
#  - workflow_dispatch -> lanzable a mano.
# ============================================================================
name: Compilar EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear los Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar tkinter
        run: python -c "import tkinter; print('tkinter OK')"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Compilar PoTranslator.exe (archivo unico)
        run: python -m PyInstaller PoTranslator.spec --noconfirm

      - name: Compilar version portable (carpeta)
        run: python -m PyInstaller PoTranslator-portable.spec --noconfirm

      - name: Empaquetar portable en ZIP y generar checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PoTranslator -DestinationPath dist/PoTranslator-portable-win64.zip
          $h1 = (Get-FileHash dist/PoTranslator.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash dist/PoTranslator-portable-win64.zip -Algorithm SHA256).Hash
          "$h1  PoTranslator.exe" | Out-File -Encoding ascii dist/PoTranslator.exe.sha256
          "$h2  PoTranslator-portable-win64.zip" | Out-File -Encoding ascii dist/PoTranslator-portable-win64.zip.sha256
          echo "SHA256 del exe: $h1"
          echo "SHA256 del zip portable: $h2"

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: PoTranslator-exe
          path: |
            dist/PoTranslator.exe
            dist/PoTranslator.exe.sha256
            dist/PoTranslator-portable-win64.zip
            dist/PoTranslator-portable-win64.zip.sha256
          if-no-files-found: error

      - name: Crear Release (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PoTranslator.exe
            dist/PoTranslator.exe.sha256
            dist/PoTranslator-portable-win64.zip
            dist/PoTranslator-portable-win64.zip.sha256
          fail_on_unmatched_files: true
