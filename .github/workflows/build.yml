# ============================================================================
#  Compila PoTranslator.exe automaticamente en Windows (GitHub Actions).
#
#  - Push a main           -> el .exe queda como artefacto de la ejecucion
#                             (pestana "Actions" -> descargar).
#  - Etiqueta v1.1, v1.2.. -> ademas crea un Release permanente con el .exe
#                             y su checksum SHA256 (.sha256) adjuntos.
#  - workflow_dispatch     -> se puede lanzar a mano desde la pestana Actions.
# ============================================================================
name: Compilar EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear los Releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar tkinter
        run: python -c "import tkinter; print('tkinter OK')"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Compilar PoTranslator.exe
        run: python -m PyInstaller PoTranslator.spec --noconfirm

      - name: Generar checksum SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PoTranslator.exe -Algorithm SHA256).Hash
          "$hash  PoTranslator.exe" | Out-File -Encoding ascii dist/PoTranslator.exe.sha256
          echo "SHA256 de PoTranslator.exe: $hash"

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PoTranslator-exe
          path: |
            dist/PoTranslator.exe
            dist/PoTranslator.exe.sha256
          if-no-files-found: error

      - name: Crear Release con el .exe (solo en etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PoTranslator.exe
            dist/PoTranslator.exe.sha256
          fail_on_unmatched_files: true
